<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>부하 테스트</title>
<link rel="stylesheet" href="style.css">
<style>
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
           padding: 18px; margin-top: 16px; }
  .stat { display: flex; justify-content: space-between; align-items: baseline;
          padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
  .stat:last-child { border: 0; }
  .stat b { font-size: 19px; font-variant-numeric: tabular-nums; }
  .ok b { color: #2F7A48; } .bad b { color: #9B3535; }
  input[type=number] { width: 90px; padding: 9px; font-size: 16px; font-family: var(--sans);
                       border: 1.5px solid var(--line); border-radius: 8px; }
  code { background: #EDEEEB; padding: 2px 6px; border-radius: 4px; font-size: 13px;
         font-family: ui-monospace, Menlo, monospace; word-break: break-all; }
  .verdict { margin-top: 16px; padding: 16px 18px; border-radius: 10px; font-size: 15px; line-height: 1.6; }
  .verdict.pass { background: #EEF4EE; border: 1px solid #C7DCC7; }
  .verdict.fail { background: #F8EEEC; border: 1px solid #E4C6C0; }
</style>
</head>
<body>
<main class="wrap">
  <p class="eyebrow">사전 점검</p>
  <h1 class="claim" style="font-size:21px">200명이 동시에 투표하면 버티는지 확인합니다.</h1>
  <p class="sub" style="margin-top:12px">
    가짜 투표를 한꺼번에 쏟아부어 응답 속도와 실패율을 봅니다.
    세션 번호 <code>9</code>(테스트용)에만 쓰므로 실제 투표 데이터는 건드리지 않습니다.
  </p>

  <div class="panel">
    <div class="stat"><span>Supabase</span><code id="db">—</code></div>
    <div class="stat">
      <span>동시 투표 인원</span>
      <input type="number" id="n" value="200" min="10" max="600" step="10">
    </div>
  </div>

  <button class="btn wide" id="run" style="margin-top:14px;padding:15px;font-size:16px">테스트 시작</button>
  <div id="out"></div>

  <p class="tiny" style="margin-top:26px">
    끝나면 <button id="clean" type="button">테스트 데이터 지우기</button>를 눌러 주십시오.
  </p>
</main>

<script src="config.js"></script>
<script src="app.js"></script>
<script>
const $ = (id) => document.getElementById(id);
$("db").textContent = SB || "(config.js에 주소가 없습니다)";

function card(html, cls) {
  const d = document.createElement("div");
  d.className = cls || "panel";
  d.innerHTML = html;
  $("out").appendChild(d);
}

$("run").onclick = async () => {
  if (!SB || SB.includes("여기에")) {
    $("out").innerHTML = `<div class="verdict fail">config.js가 아직 비어 있습니다. 먼저 check.html로 연결을 확인해 주십시오.</div>`;
    return;
  }
  $("out").innerHTML = "";
  $("run").disabled = true;
  $("run").textContent = "진행 중…";

  const N = Math.min(600, Math.max(10, +$("n").value || 200));

  /* 1. 쓰기 부하 — N명이 동시에 투표 */
  const t0 = performance.now();
  const times = [];
  let fail = 0, firstErr = "";

  await Promise.all(Array.from({ length: N }, (_, i) => {
    const s = performance.now();
    return castVote(9, "pre", "load" + i,
                    C.ROLES[i % C.ROLES.length], C.YEARS[i % C.YEARS.length], 1 + (i % 6))
      .then(() => { times.push(performance.now() - s); })
      .catch(e => { fail++; if (!firstErr) firstErr = String(e.message).slice(0, 200); });
  }));
  const wall = performance.now() - t0;

  times.sort((a, b) => a - b);
  const p50 = times[Math.floor(times.length * 0.5)] || 0;
  const p95 = times[Math.floor(times.length * 0.95)] || 0;
  const worst = times[times.length - 1] || 0;

  /* 2. 읽기 — 진행자 화면이 집계를 가져오는 속도 */
  const r0 = performance.now();
  let stored = 0, readErr = false;
  try {
    const v = await getVotes(9);
    stored = Object.keys(v.pre).length;
  } catch (e) { readErr = true; }
  const readMs = performance.now() - r0;

  const ms = (x) => Math.round(x) + "ms";
  card(`
    <div class="stat ${fail ? "bad" : "ok"}"><span>전송 성공</span><b>${N - fail} / ${N}</b></div>
    <div class="stat ${stored === N ? "ok" : "bad"}"><span>실제 저장된 표</span><b>${readErr ? "읽기 실패" : stored}</b></div>
    <div class="stat"><span>전체 소요</span><b>${ms(wall)}</b></div>
    <div class="stat ${p50 < 800 ? "ok" : "bad"}"><span>절반이 끝난 시점</span><b>${ms(p50)}</b></div>
    <div class="stat ${p95 < 2500 ? "ok" : "bad"}"><span>95%가 끝난 시점</span><b>${ms(p95)}</b></div>
    <div class="stat"><span>가장 느린 한 명</span><b>${ms(worst)}</b></div>
    <div class="stat ${readMs < 1500 ? "ok" : "bad"}"><span>집계 읽기 (진행자 화면)</span><b>${ms(readMs)}</b></div>
  `);

  const pass = fail === 0 && !readErr && stored === N && p95 < 2500 && readMs < 1500;
  card(pass
    ? `<b>통과했습니다.</b> ${N}명이 동시에 눌러도 전부 들어오고, 진행자 화면도 제때 갱신됩니다.
       실제 학회에서는 이보다 훨씬 느슨하게 퍼져서 들어오니 여유가 더 있습니다.
       다음은 목요일 동료 리허설입니다.`
    : `<b>기준을 넘지 못했습니다.</b> 한 번 더 돌려 보시고(일시적 네트워크 문제일 수 있습니다),
       그래도 같으면 Supabase 프로젝트 지역이 한국에서 먼 곳은 아닌지 확인해 주십시오.
       Northeast Asia(Seoul 또는 Tokyo)가 가장 빠릅니다.
       두 번 연속 실패하면 슬라이도 일회성으로 가시는 편이 안전합니다.
       ${firstErr ? `<p style="margin-top:10px"><code>${firstErr}</code></p>` : ""}`,
    "verdict " + (pass ? "pass" : "fail"));

  $("run").disabled = false;
  $("run").textContent = "다시 테스트";
};

$("clean").onclick = async () => {
  try {
    await sbDelete("votes?session_idx=eq.9");
    card("테스트 데이터를 지웠습니다.", "verdict pass");
  } catch (e) { card("삭제 실패: " + e.message, "verdict fail"); }
};
</script>
</body>
</html>
